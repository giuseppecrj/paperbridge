#:schema https://fnox.jdx.dev/schema.json

root = true
env = "exec"
if_missing = "error"

[providers]
onepass = { type = "1password" }

[secrets]
PAPERBRIDGE_MQTT_PASSWORD = { provider = "onepass", value = "op://Agent/paperbridge-mqtt-password/password", description = "Local development broker password" }

[profiles.device.secrets]
PAPERBRIDGE_WIFI_PASSWORD = { provider = "onepass", value = "op://Agent/home-router/password", description = "Development Wi-Fi password" }

[profiles.production.secrets]
PAPERBRIDGE_MQTT_PASSWORD = { provider = "onepass", value = "op://Agent/paperbridge-emqx-token/password", description = "EMQX Cloud production broker password" }
