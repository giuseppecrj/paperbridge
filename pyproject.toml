[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbridge"
version = "0.1.0"
description = "Local USB-to-ESP32-to-Ethernet thermal-printer bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.23,<5",
  "pyserial>=3.5,<4",
]

[project.scripts]
paperbridge = "paperbridge_cli.main:main"

[dependency-groups]
dev = [
  "esptool>=5.0,<6",
  "mpremote>=1.27,<2",
  "pytest>=8.3,<9",
  "ruff>=0.14,<0.15",
]

[tool.setuptools]
package-dir = {"" = "tools/device-cli"}
packages = ["paperbridge_cli"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["firmware/micropython", "tools/device-cli"]
testpaths = ["firmware/micropython/tests", "tools/device-cli/tests", "tools/printer-simulator/tests"]

[tool.pyright]
extraPaths = ["firmware/micropython", "tools/device-cli"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
