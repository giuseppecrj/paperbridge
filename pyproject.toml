[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paperbridge"
version = "0.1.0"
description = "Local USB-to-ESP32-to-Ethernet thermal-printer bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.23,<5", "pyserial>=3.5,<4"]

[project.scripts]
paperbridge = "paperbridge_cli.main:main"

[dependency-groups]
dev = [
  "esptool>=5.0,<6",
  "mpremote>=1.27,<2",
  "paho-mqtt>=2.1,<3",
  "pytest>=8.3,<9",
  "ruff>=0.14,<0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["tools/device-cli/paperbridge_cli"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [
  "firmware/micropython",
  "tools",
  "tools/device-cli",
  "tools/firmware",
]
testpaths = [
  "firmware/micropython/tests",
  "tools/device-cli/tests",
  "tools/firmware/tests",
  "tools/hardware/tests",
  "tools/provisioning/tests",
  "tools/printer-simulator/tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["typings"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
